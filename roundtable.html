<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PatchCrew</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f2;color:#232522;font:15px/1.65 system-ui,-apple-system,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #bbbfb6;background:#fff;border-radius:6px;padding:7px 14px;color:inherit}button.primary{background:#294636;color:#fff;border-color:#294636}button:disabled{opacity:.5;cursor:wait}input,textarea,select{border:1px solid #c7cac2;border-radius:5px;padding:8px;background:white;color:inherit}header{padding:25px 32px;border-bottom:1px solid #dadcd5;background:white;display:flex;gap:24px;align-items:center;justify-content:space-between}h1{font-size:23px;margin:0}small,.muted{color:#687064}main{max-width:1180px;margin:auto;display:grid;grid-template-columns:215px 1fr;min-height:calc(100vh - 100px)}aside{padding:25px 18px;border-right:1px solid #dadcd5}.room{display:block;width:100%;margin:0 0 8px;text-align:left;overflow:hidden;text-overflow:ellipsis}.room.active{background:#e3ece3;border-color:#768c76}.content{padding:25px 32px}.members{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:24px}.member{background:white;border:1px solid #d7dbd1;padding:10px 16px;border-radius:6px;min-width:155px}.dot{display:inline-block;width:8px;height:8px;border-radius:100%;background:#548163;margin-right:6px}.dot.bad{background:#c06443}.dot.busy{background:#ac843d}.message{margin:0 0 22px;border-top:1px solid #d9ddd3;padding-top:16px}.message.user{border-left:3px solid #819181;padding-left:15px}.message strong{font-size:14px}.body{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:7px}time{color:#788071;font-size:12px;margin-left:12px}textarea{width:100%;min-height:110px;resize:vertical}.composer{position:sticky;bottom:0;background:#f6f5f2;padding:20px 0}.controls{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:10px 0}.notice{color:#795232;white-space:pre-wrap}#empty{padding:35px 0;color:#687064}details{font-size:12px;overflow-wrap:anywhere}.newroom input{width:100%;margin:4px 0}a{color:#294636}@media(max-width:700px){header{padding:18px}header small{display:none}main{display:block}aside{padding:12px 18px;border-right:0;border-bottom:1px solid #ddd}.room{width:auto;display:inline-block;margin-right:6px}.content{padding:18px}.newroom{margin:8px 0}.member{min-width:0;flex:1;padding:9px}.composer{position:static}}
</style>
<header><div><h1>PatchCrew</h1><small>独立 Agent，一个持续协作的团队。</small></div><span id="service" class="muted">正在连接…</span></header>
<main><aside><div class="muted" style="margin-bottom:12px">讨论室</div><div id="rooms"></div><details class="newroom"><summary>新建议题</summary><form id="newroom"><input id="roomTitle" placeholder="议题名称" required maxlength="100"><button>创建讨论室</button></form></details><p><small>发言后成员保持待命。再次发送会继续原来的讨论。</small></p></aside>
<section class="content"><div id="members" class="members"></div><h2 id="title" style="font-size:18px"></h2><div id="messages"></div><p id="empty">提出一个问题，让大家开始讨论。</p><div id="notice" class="notice" role="status"></div>
<form id="composer" class="composer"><div id="target" class="muted" style="margin-bottom:8px"></div><textarea id="prompt" aria-label="发给圆桌的消息" placeholder="补充信息、追问分歧，或提出一个新问题…" required></textarea><div class="controls"><label><input name="member" type="checkbox" value="codex" checked> Codex</label><label><input name="member" type="checkbox" value="claude" checked> Claude</label><label><input name="member" type="checkbox" value="zcode" checked> ZCode</label><label>讨论 <select id="rounds"><option value="1">1 轮</option><option value="2">2 轮</option><option value="3">3 轮</option></select></label><button class="primary" id="send">发送</button><button type="button" id="cancel" hidden>停止本次讨论</button></div><small>成员依次发言，能看到前面成员的新观点；完成指定轮数后待命。</small></form></section></main>
<script src="/roundtable_ui.js" defer></script></html>
